[workspace]
resolver = "2"
members = [
    "crates/reescaller-core",
    "crates/reescaller-cli",
    "crates/reescaller-app",
    "crates/reescaller-selftest",
    "crates/reescaller-setup",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
clap = { version = "4", features = ["derive"] }
dirs = "5"
tempfile = "3"
base64 = "0.22"
tiny_http = "0.12"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
