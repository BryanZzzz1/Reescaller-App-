[package]
build = "build.rs"
name = "reescaller-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Reescaller: aplicación de escritorio (ventana propia) y servidor de depuración."
default-run = "reescaller-app"

[lib]
name = "reescaller_app"
path = "src/lib.rs"

# Aplicación de escritorio: sin consola, abre su propia ventana.
[[bin]]
name = "reescaller-app"
path = "src/bin/reescaller-app.rs"

# Servidor de depuración: con consola, abre el navegador.
[[bin]]
name = "reescaller-debug"
path = "src/main.rs"

[dependencies]
reescaller-core = { path = "../reescaller-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tiny_http.workspace = true
base64.workspace = true
dirs.workspace = true
image.workspace = true
tao = "0.31"
wry = "0.47"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
